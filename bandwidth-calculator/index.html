<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="データ容量と転送時間から必要な帯域幅を計算するシンプルなツール">
  <title>Bandwidth Calculator</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="calculator">
    <header>
      <p class="eyebrow">NETWORK TOOL</p>
      <h1>Bandwidth Calculator</h1>
      <p class="description">データ容量と転送時間から、必要な帯域幅を計算します。</p>
    </header>

    <section class="card" aria-labelledby="calculatorTitle">
      <h2 id="calculatorTitle">転送条件</h2>
      <div class="field-grid">
        <label>
          <span>データ容量</span>
          <span class="input-group">
            <input id="dataSize" type="number" min="0" step="any" value="1" inputmode="decimal">
            <select id="dataUnit" aria-label="データ容量の単位">
              <option value="MB">MB</option>
              <option value="GB" selected>GB</option>
              <option value="TB">TB</option>
            </select>
          </span>
        </label>
        <label>
          <span>転送時間</span>
          <span class="input-group">
            <input id="duration" type="number" min="0" step="any" value="1" inputmode="decimal">
            <select id="timeUnit" aria-label="転送時間の単位">
              <option value="second">秒</option>
              <option value="minute" selected>分</option>
              <option value="hour">時間</option>
            </select>
          </span>
        </label>
      </div>

      <div class="result" aria-live="polite">
        <p>必要な帯域幅</p>
        <output id="primaryResult">133.33 Mbps</output>
        <p id="secondaryResult" class="secondary-result">16.67 MB/s</p>
      </div>
      <p id="error" class="error" role="alert" hidden>0より大きい数値を入力してください。</p>
    </section>

    <p class="note">1 byte = 8 bits、1 GB = 1,000 MB として計算します。</p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
