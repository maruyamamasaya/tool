<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="指定した文字列やAND・OR条件に一致する行だけを抽出するブラウザツール">
  <title>Line Filter - 条件に合う行だけ抽出</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">LINE FILTER</p>
        <h1>欲しい行だけ、すぐ抽出。</h1>
        <p class="lead">文字列を含む・含まないなどの条件を、AND / ORで組み合わせられます。</p>
      </div>
      <div class="privacy-badge"><span aria-hidden="true">●</span> ブラウザ内で処理</div>
    </header>

    <section class="card" aria-labelledby="input-title">
      <div class="card-heading">
        <div><p class="section-label">INPUT</p><h2 id="input-title"><label for="inputText">抽出元のテキスト</label></h2></div>
        <button id="clearButton" class="text-button" type="button">すべてクリア</button>
      </div>
      <textarea id="inputText" rows="9" autofocus spellcheck="false" placeholder="2026-08-09 INFO server started&#10;2026-08-09 ERROR connection failed&#10;2026-08-09 ERROR retrying"></textarea>
      <p id="inputCount" class="count">0 行</p>
    </section>

    <section class="card conditions" aria-labelledby="condition-title">
      <div class="card-heading">
        <div><p class="section-label">CONDITIONS</p><h2 id="condition-title">抽出条件</h2></div>
        <button id="addCondition" class="secondary-button" type="button">＋ 条件を追加</button>
      </div>
      <div class="join-control">
        <span>複数条件の組み合わせ</span>
        <label><input type="radio" name="join" value="and" checked> AND <small>すべて一致</small></label>
        <label><input type="radio" name="join" value="or"> OR <small>いずれか一致</small></label>
      </div>
      <div id="conditionList" class="condition-list"></div>
      <template id="conditionTemplate">
        <div class="condition-row">
          <select class="condition-type" aria-label="条件の種類">
            <option value="contains">含む</option><option value="notContains">含まない</option>
            <option value="startsWith">で始まる</option><option value="endsWith">で終わる</option><option value="equals">完全一致</option>
          </select>
          <input class="condition-value" type="text" aria-label="検索文字列" placeholder="例：ERROR">
          <button class="remove-condition" type="button" aria-label="この条件を削除">×</button>
        </div>
      </template>
      <div class="options">
        <label><input id="ignoreCase" type="checkbox"> 大文字・小文字を無視</label>
        <label><input id="ignoreEmpty" type="checkbox" checked> 空行を除外</label>
        <label><input id="showLineNumbers" type="checkbox"> 元の行番号を付ける</label>
      </div>
    </section>

    <section class="card result-card" aria-labelledby="result-title">
      <div class="card-heading">
        <div><p class="section-label">RESULT</p><h2 id="result-title">抽出結果 <span id="resultCount" class="result-count">0 行</span></h2></div>
        <button id="copyButton" class="primary-button" type="button" disabled>結果をコピー</button>
      </div>
      <textarea id="outputText" rows="9" readonly aria-label="抽出結果" placeholder="条件に一致した行がここに表示されます"></textarea>
      <p id="summary" class="summary" aria-live="polite">テキストと条件を入力してください</p>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
