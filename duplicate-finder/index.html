<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="テキストを貼り付けて、重複している行と行番号をすばやく確認できるブラウザツール">
  <title>Duplicate Finder - 重複行を探す</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">DUPLICATE FINDER</p>
        <h1>重複行を、すぐ見つける。</h1>
        <p class="lead">テキストを貼り付けるだけで、繰り返されている行・回数・行番号を一覧にします。</p>
      </div>
      <div class="privacy-badge"><span aria-hidden="true">●</span> ブラウザ内で処理</div>
    </header>

    <section class="input-card" aria-labelledby="input-title">
      <div class="card-heading">
        <div>
          <p class="section-label">INPUT</p>
          <h2 id="input-title"><label for="inputText">チェックするテキスト</label></h2>
        </div>
        <button id="clearButton" class="text-button" type="button">すべてクリア</button>
      </div>
      <textarea id="inputText" rows="11" autofocus spellcheck="false" placeholder="ここに複数行のテキストを貼り付けてください&#10;&#10;例：&#10;apple&#10;banana&#10;apple"></textarea>
      <div class="input-footer">
        <span id="lineCount">0 行</span>
        <fieldset class="options">
          <legend class="visually-hidden">比較オプション</legend>
          <label><input id="ignoreEmpty" type="checkbox" checked> 空行を除外</label>
          <label><input id="trimWhitespace" type="checkbox" checked> 前後の空白を無視</label>
          <label><input id="ignoreCase" type="checkbox"> 大文字・小文字を無視</label>
        </fieldset>
      </div>
    </section>

    <section class="results" aria-labelledby="result-title">
      <div class="results-heading">
        <div>
          <p class="section-label">RESULT</p>
          <h2 id="result-title">チェック結果</h2>
        </div>
        <button id="copyButton" class="copy-button" type="button" disabled>重複行をコピー</button>
      </div>

      <div class="stats" aria-label="集計結果" aria-live="polite">
        <div><strong id="totalCount">0</strong><span>対象行</span></div>
        <div><strong id="uniqueCount">0</strong><span>ユニーク</span></div>
        <div class="accent-stat"><strong id="duplicateGroupCount">0</strong><span>重複グループ</span></div>
        <div><strong id="duplicateLineCount">0</strong><span>重複分の行</span></div>
      </div>

      <div id="emptyState" class="empty-state">
        <span class="empty-icon" aria-hidden="true">≡</span>
        <p><strong>テキストを入力してください</strong><br>入力すると自動で重複行をチェックします。</p>
      </div>
      <div id="noDuplicates" class="empty-state success" hidden>
        <span class="empty-icon" aria-hidden="true">✓</span>
        <p><strong>重複行はありません</strong><br>すべての行がユニークです。</p>
      </div>
      <div id="duplicateList" class="duplicate-list" hidden></div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
