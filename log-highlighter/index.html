<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ログレベルを自動判定して色分け・検索・絞り込みできるブラウザ内ログビューアー">
  <title>Log Highlighter - ログを見やすく解析</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div><p class="eyebrow">LOG ANALYSIS</p><h1>Log Highlighter</h1><p>ログを貼り付けて、ERROR / WARN / INFOなどを見やすく表示します。</p></div>
      <div class="privacy"><span aria-hidden="true">●</span> ログは外部に送信されません</div>
    </header>

    <section class="panel input-panel" aria-labelledby="input-title">
      <div class="panel-heading"><div><p class="label">INPUT</p><h2 id="input-title"><label for="logInput">ログ貼り付け</label></h2></div><span id="inputCount">0 行</span></div>
      <textarea id="logInput" rows="8" autofocus spellcheck="false" placeholder="2026-08-09 10:00:01 INFO Application started&#10;2026-08-09 10:00:05 WARN Response is slow&#10;2026-08-09 10:00:08 ERROR Database connection failed"></textarea>
      <div class="actions">
        <button id="analyzeButton" class="primary" type="button">ログ解析</button>
        <button id="errorOnly" type="button">ERRORのみ</button><button id="warnAbove" type="button">WARN以上</button><button id="showAll" type="button">すべて表示</button>
        <button id="copyButton" type="button">結果をコピー</button><button id="clearButton" class="danger-text" type="button">入力をクリア</button>
      </div>
    </section>

    <section class="panel result-panel" aria-labelledby="result-title">
      <div class="panel-heading result-heading"><div><p class="label">ANALYSIS</p><h2 id="result-title">解析結果</h2></div><span id="visibleCount">0 行を表示</span></div>
      <div id="levelFilters" class="level-filters" aria-label="ログレベルで絞り込み"></div>
      <div class="toolbar">
        <label class="search"><span>検索</span><input id="searchInput" type="search" placeholder="キーワードを入力" autocomplete="off"></label>
        <strong id="matchCount" aria-live="polite">一致：0件</strong>
        <button id="previousMatch" type="button" aria-label="前の検索結果">↑ 前へ</button><button id="nextMatch" type="button" aria-label="次の検索結果">↓ 次へ</button>
        <label class="context">前後 <select id="contextLines"><option value="0">0行</option><option value="1">1行</option><option value="3">3行</option><option value="5">5行</option><option value="10">10行</option></select></label>
        <label class="wrap"><input id="wrapLines" type="checkbox"> 長い行を折り返す</label>
      </div>
      <details class="custom-panel"><summary>カスタムハイライト <span id="customSummary">0 / 10</span></summary><div class="custom-form"><input id="customInput" type="text" maxlength="100" placeholder="例：Timeout、userId=、Exception"><button id="addCustom" type="button">追加</button></div><div id="customList" class="custom-list"></div></details>
      <div id="logViewer" class="log-viewer" tabindex="0" aria-label="解析したログ" aria-live="polite"><p class="empty">ログを貼り付けると、ここに解析結果が表示されます。</p></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
