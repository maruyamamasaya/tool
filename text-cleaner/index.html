<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="リッチテキストの書式を取り除き、通常のテキストにするシンプルなツール">
  <title>Text Cleaner</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TEXT CLEANER</p>
      <h1>テキストを、きれいに。</h1>
      <p class="lead">書式付きの文章を貼り付けると、通常のテキストに変換します。</p>
    </header>

    <section class="cleaner" aria-label="テキストクリーナー">
      <label for="textInput">書式を消したいテキスト</label>
      <textarea id="textInput" rows="12" autofocus placeholder="ここにリッチテキストを貼り付けてください"></textarea>

      <div class="footer">
        <p id="count" aria-live="polite">0 文字</p>
        <div class="actions">
          <button id="clearButton" class="secondary" type="button" disabled>クリア</button>
          <button id="copyButton" class="primary" type="button" disabled>コピー</button>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <p class="privacy"><span aria-hidden="true">●</span> 入力内容はブラウザ内だけで処理されます。</p>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
