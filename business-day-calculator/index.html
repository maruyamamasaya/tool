<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="カレンダーで期間を選び、日本の祝日や独自の休日を除いた営業日数を確認できます">
  <meta name="theme-color" content="#f3f4f5">
  <title>営業日カウンター — カレンダーで期間を確認</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="../" aria-label="Browser Tools トップへ"><span class="brand-icon" aria-hidden="true"></span><span><b>Business Days</b><small>営業日をすばやく確認</small></span></a>
      <button id="todayButton" class="subtle-button" type="button">今日</button>
    </header>

    <div class="workspace">
      <section class="calendar-card" aria-labelledby="monthLabel">
        <div class="month-nav">
          <button id="previousMonth" class="nav-button" type="button" aria-label="前の月">‹</button>
          <div><p id="yearLabel"></p><h1 id="monthLabel"></h1></div>
          <button id="nextMonth" class="nav-button" type="button" aria-label="次の月">›</button>
        </div>
        <div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
        <div id="calendarGrid" class="calendar-grid" role="grid" aria-label="営業日を調べる期間を選択"></div>
        <div class="legend"><span><i class="weekday-key"></i>営業日</span><span><i class="saturday-key"></i>土曜</span><span><i class="holiday-key"></i>日曜・祝日</span><span><i class="selected-key"></i>選択期間</span></div>
      </section>

      <aside class="control-card" aria-labelledby="controlTitle">
        <div class="panel-heading"><p>期間を選択</p><h2 id="controlTitle">営業日を数える</h2></div>
        <p id="selectionHelp" class="help">カレンダーで開始日を選んでください。</p>
        <div class="date-fields">
          <label><span>開始日</span><input id="startDate" type="date"></label>
          <span aria-hidden="true">〜</span>
          <label><span>終了日</span><input id="endDate" type="date"></label>
        </div>
        <div class="quick-actions" aria-label="期間のかんたん指定">
          <button type="button" data-range="7">今日から1週間</button>
          <button type="button" data-range="30">今日から30日</button>
          <button id="thisMonth" type="button">今月</button>
        </div>
        <p id="dateError" class="error" role="alert"></p>

        <section class="result-section" aria-labelledby="resultTitle">
          <div class="section-title"><h3 id="resultTitle">期間の内訳</h3><span>両端の日を含む</span></div>
          <div class="main-result"><span>営業日</span><strong id="businessDays">—</strong><small>日</small></div>
          <div class="stats">
            <div><span>期間</span><strong id="totalDays">—</strong><small>日</small></div>
            <div><span>土日</span><strong id="weekendDays">—</strong><small>日</small></div>
            <div><span>祝日</span><strong id="holidayDays">—</strong><small>日</small></div>
          </div>
        </section>

        <section class="output-section" aria-labelledby="outputTitle">
          <div class="section-title"><h3 id="outputTitle">期間テキスト</h3></div>
          <label class="format-field" for="outputFormat"><span>フォーマット</span>
            <select id="outputFormat">
              <option value="multiline">改行＋〜</option>
              <option value="tilde">〜（1行）</option>
              <option value="weekday">曜日つき</option>
              <option value="hyphen">ハイフン</option>
              <option value="duration">日数つき</option>
            </select>
          </label>
          <textarea id="outputText" rows="3" readonly placeholder="期間を選択すると、ここに表示されます"></textarea>
          <button id="copyButton" class="primary-button" type="button" disabled>テキストをコピー</button>
          <p id="copyStatus" class="status" role="status" aria-live="polite"></p>
        </section>

        <details class="holiday-settings">
          <summary>独自の祝日を追加</summary>
          <p>会社休日などを追加すると、祝日として営業日計算に反映します（このページを開いている間のみ）。</p>
          <div class="holiday-form">
            <label><span>日付</span><input id="customHolidayDate" type="date"></label>
            <label><span>祝日名</span><input id="customHolidayName" type="text" maxlength="30" placeholder="例：会社休日"></label>
            <button id="addHoliday" class="subtle-button" type="button">追加</button>
          </div>
          <p id="holidayError" class="error" role="alert"></p>
          <ul id="customHolidayList" class="holiday-list"></ul>
        </details>
      </aside>
    </div>
    <footer><span>Browser Tools</span><span>土日・祝日を除いて算出</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
