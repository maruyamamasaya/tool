<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="開始日と終了日から、日本の祝日を除いた営業日数と期間の内訳を確認できます">
  <meta name="theme-color" content="#f5f6f4">
  <title>営業日カウンター — 期間の日数を確認</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="../" aria-label="Browser Tools トップへ">
        <span class="brand-icon" aria-hidden="true"></span>
        <span><b>Business Days</b><small>営業日をすばやく確認</small></span>
      </a>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
      <p class="eyebrow">DATE RANGE CHECKER</p>
      <h1 id="pageTitle">この期間、営業日は何日？</h1>
      <p>開始日と終了日を含めて、日本の土日・祝日を数えます。</p>
    </section>

    <div class="workspace">
      <section class="input-card" aria-labelledby="inputTitle">
        <div class="section-heading"><span>01</span><div><p>期間を指定</p><h2 id="inputTitle">日付を選択</h2></div></div>
        <div class="date-fields">
          <label><span>開始日</span><input id="startDate" type="date"></label>
          <span class="range-arrow" aria-hidden="true">→</span>
          <label><span>終了日</span><input id="endDate" type="date"></label>
        </div>
        <div class="quick-actions" aria-label="期間のかんたん指定">
          <button type="button" data-range="7">今日から1週間</button>
          <button type="button" data-range="30">今日から30日</button>
          <button id="thisMonth" type="button">今月</button>
        </div>
        <p id="dateError" class="error" role="alert"></p>
        <p class="note"><span aria-hidden="true">i</span> 営業日は月〜金から日本の祝日を除いて算出します。</p>
      </section>

      <section class="result-card" aria-labelledby="resultTitle">
        <div class="section-heading light"><span>02</span><div><p>集計結果</p><h2 id="resultTitle">期間の内訳</h2></div></div>
        <div class="main-result"><span>営業日</span><strong id="businessDays">—</strong><small>日</small></div>
        <div class="stats">
          <div><span>期間</span><strong id="totalDays">—</strong><small>日間</small></div>
          <div><span>土日</span><strong id="weekendDays">—</strong><small>日</small></div>
          <div><span>祝日</span><strong id="holidayDays">—</strong><small>日</small></div>
        </div>
        <p class="count-note">※ 開始日・終了日の両方を含む日数です</p>
      </section>
    </div>

    <section class="output-card" aria-labelledby="outputTitle">
      <div><p class="eyebrow">COPY TEXT</p><h2 id="outputTitle">期間テキスト</h2><p>選択した期間だけをシンプルな形式で出力します。</p></div>
      <div class="output-area">
        <textarea id="outputText" rows="3" readonly aria-label="期間テキスト" placeholder="日付を選択してください"></textarea>
        <button id="copyButton" type="button" disabled>コピー</button>
        <p id="copyStatus" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer><span>Browser Tools</span><span>時刻は計算に含みません</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
