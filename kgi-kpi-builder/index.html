<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KGIとKPIを管理し、Markdownで保存・再編集できるブラウザツール">
  <title>KGI / KPI Builder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div><span class="brand-mark">◎</span><strong>KGI / KPI Builder</strong><span class="local-badge">LOCAL ONLY</span></div>
    <button id="newSet" class="button primary" type="button">＋ 新規作成</button>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-heading"><span>テーマ</span><span id="setCount"></span></div>
      <nav id="setList" aria-label="テーマ一覧"></nav>
      <div class="backup-actions">
        <button id="exportJson" class="button subtle" type="button">JSONエクスポート</button>
        <button id="importJsonButton" class="button subtle" type="button">JSONインポート</button>
        <input id="importJsonFile" type="file" accept="application/json,.json" hidden>
      </div>
    </aside>
    <main class="workspace">
      <div class="workspace-head">
        <div><p class="eyebrow">GOAL SETTINGS</p><h1>目標と指標を設定</h1></div>
        <div class="saved"><span></span><span id="saveStatus">自動保存</span></div>
      </div>

      <section class="form-section theme-section">
        <label for="theme">テーマ</label>
        <input id="theme" class="large-input" placeholder="例：応用情報技術者試験" autocomplete="off">
      </section>

      <section class="form-section">
        <div class="section-title"><span class="number">01</span><div><p class="eyebrow">FINAL GOAL</p><h2>KGI</h2></div></div>
        <div class="card kgi-card">
          <label class="wide">目標<input id="kgiGoal" placeholder="最終的に達成したい目標"></label>
          <label>期限<input id="kgiDeadline" placeholder="YYYY/MM/DD"></label>
          <label class="wide">メモ<textarea id="kgiMemo" rows="3" placeholder="補足があれば入力"></textarea></label>
        </div>
      </section>

      <section class="form-section">
        <div class="section-title kpi-title"><span class="number">02</span><div><p class="eyebrow">KEY INDICATORS</p><h2>KPI <span id="kpiCount"></span></h2></div><button id="addKpi" class="button outline" type="button">＋ KPI追加</button></div>
        <p class="hint">ドラッグして指標の順番を変更できます。</p>
        <div id="kpiList" class="kpi-list"></div>
      </section>

      <section class="form-section markdown-section">
        <div class="section-title"><span class="number">03</span><div><p class="eyebrow">TAKE IT WITH YOU</p><h2>Markdown</h2></div></div>
        <div class="markdown-grid">
          <div><div class="textarea-head"><label for="markdownImport">Markdown読込</label><button id="loadMarkdown" class="text-button" type="button">GUIに復元</button></div><textarea id="markdownImport" rows="13" spellcheck="false" placeholder="以前出力したMarkdownを貼り付け"></textarea></div>
          <div><div class="textarea-head"><label for="markdownOutput">Markdown出力</label><button id="copyMarkdown" class="button dark" type="button">コピー</button></div><textarea id="markdownOutput" rows="13" readonly></textarea></div>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <template id="kpiTemplate">
    <article class="card kpi-card" draggable="true">
      <div class="drag" title="ドラッグして並べ替え" aria-label="ドラッグして並べ替え">⠿</div>
      <div class="kpi-card-head"><span class="kpi-number"></span><button class="delete-button" type="button">削除</button></div>
      <div class="fields">
        <label class="wide">指標名<input data-field="name" placeholder="例：過去問正答率"></label>
        <label>現在値<input data-field="current" inputmode="decimal" placeholder="65"></label>
        <label>目標値<input data-field="target" inputmode="decimal" placeholder="80"></label>
        <label>単位<input data-field="unit" list="unitSuggestions" placeholder="%"></label>
        <label>期限<input data-field="deadline" placeholder="YYYY/MM/DD"></label>
        <label class="wide">メモ<textarea data-field="memo" rows="2" placeholder="補足があれば入力"></textarea></label>
      </div>
      <div class="progress-area"><div class="progress-label"><span>達成率</span><strong class="progress-value">—</strong></div><div class="progress-track"><div class="progress-fill"></div></div><p class="progress-detail"></p></div>
    </article>
  </template>
  <datalist id="unitSuggestions"><option value="%"><option value="問"><option value="時間"><option value="件"><option value="回"><option value="冊"><option value="円"><option value="人"><option value="ポイント"></datalist>
  <script src="./app.js" defer></script>
</body>
</html>
