<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="会議の残り時間と終了予定をシンプルに確認できるミーティングタイマー">
  <meta name="theme-color" content="#0c1324">
  <title>Meeting Timer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><p>MEETING CONTROL</p><h1>Meeting Timer</h1></div>
      </div>
      <div class="now"><span>現在時刻</span><strong id="currentTime">--:--:--</strong></div>
    </header>

    <section class="workspace">
      <section class="timer-panel" aria-live="polite">
        <div class="remaining-block">
          <p>会議終了まで</p>
          <strong id="remainingMinutes">--</strong>
          <span>分</span>
        </div>
        <div class="end-schedule"><span>終了予定</span><strong id="scheduledEnd">--:--</strong></div>
      </section>

      <form id="settings" class="settings" autocomplete="off">
        <div class="section-heading"><span>01</span><div><h2>会議時間</h2><p>開始と終了を設定</p></div></div>
        <label class="field"><span>開始時刻</span><span class="time-selects"><select id="startHour" aria-label="開始時刻（時）" required></select><b>時</b><select id="startMinute" aria-label="開始時刻（分）" required></select><b>分</b></span></label>
        <div class="end-mode" role="group" aria-label="終了の指定方法">
          <button class="active" data-end-mode="datetime" type="button">終了時刻</button>
          <button data-end-mode="duration" type="button">何時間</button>
        </div>
        <label id="endAtField" class="field"><span>終了時刻</span><span class="time-selects"><select id="endHour" aria-label="終了時刻（時）" required></select><b>時</b><select id="endMinute" aria-label="終了時刻（分）" required></select><b>分</b></span></label>
        <label id="durationField" class="field" hidden><span>会議時間</span><span class="input-suffix"><input id="durationHours" type="number" min="0.1" max="168" step="0.1" value="1"><b>時間</b></span></label>
        <p id="formError" class="error" role="alert"></p>
        <button class="apply" type="submit">タイマーを設定</button>
      </form>
    </section>
    <footer><span><i></i> 入力内容はこのブラウザ内だけに保存されます</span><span>自動更新</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
