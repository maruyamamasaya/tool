<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="均等なくじと確率付きガチャを、ブラウザだけで抽選・集計できるシミュレーター">
  <title>くじ・抽選シミュレーター</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="hero">
    <div class="hero-copy"><p class="eyebrow">LOTTERY LAB</p><h1>くじ・抽選<br><em>シミュレーター</em></h1><p>運試しも、確率検証も。入力したデータは外部へ送信されません。</p></div>
    <div class="ticket" aria-hidden="true"><span>LUCKY</span><strong>?</strong><small>GOOD LUCK</small></div>
  </header>

  <main>
    <section class="card setup" aria-labelledby="setup-title">
      <div class="section-head"><div><span class="number">01</span><h2 id="setup-title">くじをつくる</h2></div><span class="private">● ブラウザ内で完結</span></div>
      <div class="mode-tabs" role="radiogroup" aria-label="抽選モード">
        <label><input type="radio" name="mode" value="equal" checked><span>均等なくじ<small>すべて同じ確率</small></span></label>
        <label><input type="radio" name="mode" value="weighted"><span>確率付きガチャ<small>確率を個別に設定</small></span></label>
      </div>
      <div class="editor-grid">
        <label class="field"><span>候補 <b id="itemCount">4項目</b></span><textarea id="items" rows="7" spellcheck="false">A賞
B賞
C賞
はずれ</textarea><small>1行につき1つ入力してください</small></label>
        <div id="probabilityPanel" class="probability-panel" hidden><div class="probability-label"><span>確率設定</span><b id="totalProbability">合計 100%</b></div><div id="probabilityRows"></div><p id="probabilityWarning" class="warning" role="alert" hidden>⚠ 確率の合計を100%にしてください</p></div>
      </div>
    </section>

    <section class="card draw-card" aria-labelledby="draw-title">
      <div class="section-head"><div><span class="number">02</span><h2 id="draw-title">抽選する</h2></div><label class="duplicate"><input id="duplicates" type="checkbox" checked><span></span>重複あり</label></div>
      <div class="draw-buttons">
        <button type="button" data-count="1" class="primary"><span>✦</span><b>1回引く</b><small>DRAW ONCE</small></button>
        <button type="button" data-count="10"><b>10回引く</b><small>DRAW × 10</small></button>
        <button type="button" data-count="100"><b>100回</b><small>SIMULATION</small></button>
        <button type="button" data-count="1000"><b>1,000回</b><small>SIMULATION</small></button>
      </div>
      <div id="error" class="error" role="alert" hidden></div>
      <div id="resultStage" class="result-stage" aria-live="polite"><span>抽選結果</span><strong id="latestResult">READY?</strong><small id="resultMeta">ボタンを押して抽選スタート</small></div>
    </section>

    <div class="lower-grid">
      <section class="card history-card" aria-labelledby="history-title"><div class="section-head"><div><span class="number">03</span><h2 id="history-title">抽選履歴</h2><b id="historyCount" class="pill">0件</b></div><div class="actions"><button id="copy" type="button">⧉ コピー</button><button id="clear" type="button">クリア</button></div></div><ol id="history" class="history"><li class="empty">まだ抽選結果がありません</li></ol></section>
      <section class="card stats-card" aria-labelledby="stats-title"><div class="section-head"><div><span class="number">04</span><h2 id="stats-title">集計結果</h2></div><b id="totalDraws">TOTAL 0</b></div><div id="statsEmpty" class="stats-empty">抽選すると、ここに集計が表示されます。</div><div id="stats" hidden><div class="table-wrap"><table><thead><tr><th>項目</th><th>当選回数</th><th>当選率</th><th>理論値</th><th>差</th></tr></thead><tbody id="statsBody"></tbody></table></div><div id="chart" class="chart"></div></div></section>
    </div>
  </main>
  <div id="toast" class="toast" role="status">コピーしました</div>
  <footer>LOTTERY LAB <span>•</span> RANDOMNESS, VISUALIZED.</footer>
</body>
</html>
