<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSV・箇条書き・改行区切りなど、さまざまなリストから1つをランダムに抽選">
  <title>Random Picker — リストから抽選</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div><p class="eyebrow">RANDOM PICKER</p><h1>リストから、<br><span>ひとつ選ぶ。</span></h1><p class="lead">CSV、箇条書き、改行やカンマ区切り。形式を気にせず貼り付けて、すぐに抽選できます。</p></div>
      <div class="hero-dice" aria-hidden="true"><span>✦</span><i></i><i></i><i></i></div>
    </header>

    <section class="workspace" aria-labelledby="input-title">
      <div class="section-head"><div><p class="step">STEP 01</p><h2 id="input-title">候補を入力</h2></div><span class="privacy"><b>●</b> 入力はブラウザ内だけで処理</span></div>
      <div id="dropZone" class="drop-zone">
        <textarea id="source" rows="9" spellcheck="false" aria-describedby="formatHint">りんご
バナナ
オレンジ
ぶどう
メロン</textarea>
        <div class="input-footer"><span id="formatHint">改行・カンマ・タブ・セミコロン・箇条書き・CSV・JSON 配列に対応</span><label class="file-button">ファイルを選択<input id="fileInput" type="file" accept=".txt,.csv,.tsv,.json,text/plain,text/csv,application/json"></label></div>
      </div>
      <div class="controls">
        <label class="select-field"><span>区切り形式</span><select id="format"><option value="auto">自動判定</option><option value="newline">改行</option><option value="comma">カンマ / CSV</option><option value="tab">タブ</option><option value="semicolon">セミコロン</option></select></label>
        <label class="check"><input id="unique" type="checkbox" checked><span aria-hidden="true"></span>重複をまとめる</label>
        <button id="clear" class="clear" type="button">入力をクリア</button>
      </div>
      <div id="preview" class="preview" aria-live="polite"><strong id="count">5</strong><span>件の候補を検出</span><div id="chips" class="chips"></div></div>
    </section>

    <section class="result-card" aria-labelledby="result-title">
      <div class="section-head"><div><p class="step">STEP 02</p><h2 id="result-title">抽選結果</h2></div><span id="odds" class="odds">当選確率 1 / 5</span></div>
      <div id="result" class="result" aria-live="assertive"><span>YOUR PICK</span><strong id="picked">準備OK！</strong><small id="resultNote">下のボタンを押して抽選してください</small></div>
      <button id="draw" class="draw" type="button"><span aria-hidden="true">✦</span><b>ランダムに選ぶ</b><small>PICK ONE</small></button>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="history-card" aria-labelledby="history-title">
      <div class="section-head"><div><p class="step">HISTORY</p><h2 id="history-title">最近の抽選</h2></div><button id="clearHistory" class="clear" type="button">履歴を消去</button></div>
      <ol id="history" class="history"><li class="empty">まだ抽選していません</li></ol>
    </section>
  </main>
  <footer>RANDOM PICKER <span>•</span> FAIR &amp; PRIVATE</footer>
</body>
</html>
