<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A・AAAA・CNAME・MX・TXTのDNSレコードを画面操作で作成し、ゾーンファイル形式で出力">
  <title>DNS Record Builder</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">NETWORK UTILITY</p>
        <h1><span class="logo" aria-hidden="true">⌁</span> DNS Record Builder</h1>
        <p class="intro">DNSレコードを、迷わず正しいフォーマットに。</p>
      </div>
      <span class="local-badge"><i></i> ブラウザ内で処理</span>
    </header>

    <section class="panel" aria-labelledby="type-title">
      <div class="section-heading"><span>01</span><div><h2 id="type-title">レコードタイプ</h2><p>作成するレコードを選択</p></div></div>
      <div id="typePicker" class="type-picker" role="radiogroup" aria-label="レコードタイプ">
        <button class="active" type="button" data-type="A" role="radio" aria-checked="true"><b>A</b><small>IPv4 アドレス</small></button>
        <button type="button" data-type="AAAA" role="radio" aria-checked="false"><b>AAAA</b><small>IPv6 アドレス</small></button>
        <button type="button" data-type="CNAME" role="radio" aria-checked="false"><b>CNAME</b><small>別名</small></button>
        <button type="button" data-type="MX" role="radio" aria-checked="false"><b>MX</b><small>メールサーバー</small></button>
        <button type="button" data-type="TXT" role="radio" aria-checked="false"><b>TXT</b><small>テキスト</small></button>
      </div>
    </section>

    <section class="panel" aria-labelledby="details-title">
      <div class="section-heading"><span>02</span><div><h2 id="details-title">レコード詳細</h2><p>必要な値を入力</p></div></div>
      <form id="recordForm" novalidate>
        <div class="form-grid">
          <label class="field"><span>ホスト名 <em>必須</em></span><input id="host" type="text" value="@" placeholder="@ または www" autocomplete="off"><small>@ はルートドメインを表します</small></label>
          <label class="field"><span>TTL</span><div class="input-unit"><input id="ttl" type="number" value="3600" min="0" step="1"><span>秒</span></div><small>一般的な値：3600（1時間）</small></label>
          <label class="field value-field"><span id="valueLabel">IPv4 アドレス <em>必須</em></span><input id="value" type="text" value="192.0.2.1" placeholder="192.0.2.1" autocomplete="off"><small id="valueHint">例：192.0.2.1</small></label>
          <label id="priorityField" class="field" hidden><span>優先度 <em>必須</em></span><input id="priority" type="number" value="10" min="0" max="65535" step="1"><small>小さい値ほど優先されます</small></label>
        </div>
        <p id="formError" class="error" role="alert" aria-live="polite"></p>
        <button class="add-button" type="submit"><span>＋</span> レコードを追加</button>
      </form>
    </section>

    <section class="panel records-panel" aria-labelledby="records-title">
      <div class="records-heading"><div class="section-heading"><span>03</span><div><h2 id="records-title">作成したレコード</h2><p><b id="recordCount">0</b> 件のレコード</p></div></div><button id="clearButton" class="text-button" type="button" disabled>すべて削除</button></div>
      <div id="emptyState" class="empty-state"><span aria-hidden="true">＋</span><p>まだレコードがありません</p><small>上のフォームからレコードを追加してください</small></div>
      <div id="recordList" class="record-list"></div>
    </section>

    <section class="output-panel" aria-labelledby="output-title">
      <div class="output-heading"><div><p class="eyebrow">ZONE FILE</p><h2 id="output-title">テキスト出力</h2></div><button id="copyButton" type="button" disabled><span aria-hidden="true">▣</span> コピー</button></div>
      <pre id="output" aria-live="polite"><code>; 追加したレコードがここに表示されます</code></pre>
      <p id="copyStatus" class="copy-status" aria-live="polite"></p>
    </section>
    <footer><span>RFC準拠のゾーンファイル形式</span><span>入力内容は外部に送信されません</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
