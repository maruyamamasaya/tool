<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="複数のストップウォッチとカウントダウンをブラウザだけで管理するタイマーボード">
  <meta name="theme-color" content="#0b101b">
  <title>Timer Board</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><p class="eyebrow">LOCAL TIME WORKSPACE</p><h1>Timer Board</h1></div>
      </div>
      <div class="clock" aria-label="現在時刻">
        <span id="currentDate"></span>
        <strong id="currentTime">--:--:--</strong>
        <span class="live-dot" aria-hidden="true"></span>
      </div>
    </header>

    <section class="command-bar" aria-label="タイマー操作">
      <div>
        <strong id="boardSummary">0 timers</strong>
        <span id="runningSummary">すべて停止中</span>
      </div>
      <div class="bulk-actions">
        <button id="pauseAll" class="button ghost" type="button">Ⅱ <span>すべて一時停止</span></button>
        <button id="resetFinished" class="button ghost" type="button">↺ <span>完了のみリセット</span></button>
        <button id="resetAll" class="button ghost" type="button">↻ <span>すべてリセット</span></button>
        <button id="addTimer" class="button primary" type="button"><b>＋</b> タイマーを追加</button>
      </div>
    </section>

    <section id="timerGrid" class="timer-grid" aria-label="タイマー一覧"></section>

    <section id="emptyState" class="empty-state">
      <div class="empty-icon" aria-hidden="true">＋</div>
      <h2>最初のタイマーを作成</h2>
      <p>ストップウォッチもカウントダウンも、最大12個まで同時に管理できます。</p>
      <button id="emptyAddTimer" class="button primary" type="button">＋ タイマーを追加</button>
    </section>

    <footer><span><i></i> データはこのブラウザ内だけに保存されます</span><span>最大 12 timers</span></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
