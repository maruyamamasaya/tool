<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="範囲と個数を選び、ランダムな整数をまとめて生成・コピーできるブラウザツール">
  <title>乱数ジェネレーター</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="dice" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div>
        <p class="eyebrow">RANDOM NUMBER TOOL</p>
        <h1>乱数ジェネレーター</h1>
        <p class="lead">範囲と個数を選ぶだけ。必要な乱数を、使いやすい形式で。</p>
      </div>
    </header>

    <section class="panel" aria-labelledby="settings-title">
      <div class="panel-title">
        <div><span class="step">01</span><h2 id="settings-title">生成条件</h2></div>
        <span class="local-badge"><span></span>ブラウザ内で生成</span>
      </div>
      <div class="settings">
        <label>数値の範囲
          <span class="select-wrap"><select id="range">
            <option value="1,10">1 〜 10</option>
            <option value="1,100" selected>1 〜 100</option>
            <option value="1,1000">1 〜 1,000</option>
            <option value="0,255">0 〜 255</option>
            <option value="-100,100">-100 〜 100</option>
            <option value="-1000,1000">-1,000 〜 1,000</option>
            <option value="digits">桁数を指定…</option>
          </select></span>
          <span id="digitsControl" class="digits-control" hidden>
            <span class="digits-caption">桁数</span>
            <span class="number-wrap"><input id="digits" type="number" min="1" max="32" value="16" inputmode="numeric" aria-describedby="digitsHelp"><span>桁</span></span>
            <span class="zero-start"><input id="zeroStart" type="checkbox"><span>0から開始する</span></span>
            <small id="digitsHelp">1〜32桁（例：3桁なら100〜999）</small>
          </span>
        </label>
        <label>生成する数
          <span class="select-wrap"><select id="count">
            <option value="1">1個</option><option value="5">5個</option>
            <option value="10" selected>10個</option><option value="20">20個</option>
            <option value="50">50個</option><option value="100">100個</option>
          </select></span>
        </label>
        <label>区切り形式
          <span class="select-wrap"><select id="separator">
            <option value="newline" selected>改行</option>
            <option value="comma">カンマ（,）</option>
            <option value="space">スペース</option>
            <option value="tab">タブ</option>
            <option value="pipe">パイプ（|）</option>
          </select></span>
        </label>
      </div>
      <button id="generate" class="generate" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-4V3M4 17h4v4M19 12a7 7 0 0 0-12-5L4 10M5 12a7 7 0 0 0 12 5l3-3"/></svg>
        乱数を生成
      </button>
    </section>

    <section class="panel results-panel" aria-labelledby="results-title">
      <div class="panel-title">
        <div><span class="step">02</span><h2 id="results-title">生成結果</h2><span id="resultMeta" class="meta"></span></div>
        <button id="copy" class="copy" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          コピー
        </button>
      </div>
      <textarea id="output" readonly aria-label="生成された乱数"></textarea>
      <p class="hint">形式を変更すると、結果へすぐに反映されます。</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">コピーしました</div>
  <footer>Random Number Generator · Simple, fast and private</footer>
  <script src="./app.js" defer></script>
</body>
</html>
