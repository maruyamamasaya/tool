<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="改行やタブなどの特殊文字をエスケープ・復元・可視化するブラウザツール">
  <title>Escape Tool</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="mark" aria-hidden="true">\</div>
      <div>
        <p class="eyebrow">DEVELOPER UTILITY</p>
        <h1>Escape Tool</h1>
        <p class="lead">見えない文字を、扱いやすく。</p>
      </div>
    </header>

    <section class="workspace" aria-label="特殊文字の変換">
      <div class="tabs" role="tablist" aria-label="変換モード">
        <button class="tab active" id="escapeTab" type="button" role="tab" aria-selected="true" data-mode="escape"><span aria-hidden="true">\n</span>エスケープ</button>
        <button class="tab" id="restoreTab" type="button" role="tab" aria-selected="false" data-mode="restore"><span aria-hidden="true">Aa</span>復元</button>
        <button class="tab" id="visualizeTab" type="button" role="tab" aria-selected="false" data-mode="visualize"><span aria-hidden="true">·↵</span>可視化</button>
      </div>

      <div class="panel">
        <div class="field-heading">
          <label for="textInput">入力</label>
          <span id="inputCount">0 文字</span>
        </div>
        <textarea id="textInput" rows="7" spellcheck="false" autofocus placeholder="ここにテキストを入力または貼り付け"></textarea>

        <div class="flow" aria-hidden="true"><span></span><b>↓</b><span></span></div>

        <div class="field-heading">
          <span id="resultLabel">エスケープ結果</span>
          <span id="resultCount">0 文字</span>
        </div>
        <pre id="result" class="result" tabindex="0" aria-labelledby="resultLabel"><span class="placeholder">変換結果がここに表示されます</span></pre>
        <p id="warning" class="warning" role="alert" hidden></p>

        <div class="panel-footer">
          <p id="privacy"><i aria-hidden="true"></i>すべてブラウザ内で処理されます</p>
          <div class="actions">
            <button id="clearButton" class="secondary" type="button" disabled>クリア</button>
            <button id="copyButton" class="primary" type="button" disabled><span aria-hidden="true">▣</span> 結果をコピー</button>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <aside class="legend" aria-label="対応する特殊文字">
      <span>対応文字</span><code>改行 \n</code><code>タブ \t</code><code>復帰 \r</code><code>\ \</code><code>&quot; \&quot;</code><code>NULL \0</code>
    </aside>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
