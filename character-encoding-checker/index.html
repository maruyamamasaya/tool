<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="貼り付けたテキストの文字構成と、文字化けの可能性がある文字をブラウザ内で確認するツール">
  <title>Character Encoding Checker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div class="mark" aria-hidden="true">文</div>
      <div>
        <p class="eyebrow">CHARACTER ENCODING CHECKER</p>
        <h1>文字の構成を、ひと目で確認。</h1>
        <p class="lead">テキストを貼り付けると、文字種の割合と怪しい文字を自動で調べます。</p>
      </div>
    </header>

    <section class="card input-card" aria-labelledby="inputTitle">
      <div class="section-heading">
        <div>
          <h2 id="inputTitle">チェックするテキスト</h2>
          <p>入力内容はブラウザの外へ送信されません。</p>
        </div>
        <button id="clearButton" type="button" disabled>クリア</button>
      </div>
      <textarea id="textInput" rows="12" autofocus spellcheck="false" placeholder="ここにテキストを貼り付けてください"></textarea>
      <p class="input-hint"><span aria-hidden="true">●</span> 入力と同時に解析します</p>
    </section>

    <section class="results" aria-labelledby="resultTitle">
      <div class="results-heading">
        <div>
          <p class="eyebrow">ANALYSIS</p>
          <h2 id="resultTitle">解析結果</h2>
        </div>
        <p id="resultStatus" class="result-status" aria-live="polite">テキストを入力してください</p>
      </div>

      <div id="summaryGrid" class="summary-grid" aria-label="文字数の集計"></div>

      <div class="card composition-card">
        <h3>文字種の割合</h3>
        <div id="composition" class="composition"></div>
      </div>

      <div class="card suspicious-card">
        <div class="suspicious-heading">
          <div>
            <h3>怪しい文字</h3>
            <p>置換文字、不可視文字、制御文字などを表示します。</p>
          </div>
          <span id="suspiciousBadge" class="badge">0 件</span>
        </div>
        <div id="suspiciousList" class="suspicious-list" aria-live="polite"></div>
      </div>
    </section>

    <aside class="notice">
      <span aria-hidden="true">i</span>
      <p><strong>このツールで文字コードの確定判定はできません。</strong><br>ブラウザに渡された後の文字列を解析し、文字化けや文字種の混在に気づくための目安を表示します。</p>
    </aside>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
