<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="約120色からHEX・RGBカラーコードを選択、プレビュー、コピーできるカラーツール">
  <title>Color Palette</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">COLOR CODE TOOL</p>
      <h1>Color <span>Palette</span></h1>
      <p>色を見つけて、カラーコードをすぐにコピー。</p>
    </header>

    <section class="picker-card" aria-labelledby="picker-title">
      <div class="preview" id="preview" aria-label="選択色のプレビュー"></div>
      <div class="picker-content">
        <h2 id="picker-title">カラーコードを入力</h2>
        <p class="hint"># あり・なし、どちらでも入力できます</p>
        <div class="input-row">
          <span aria-hidden="true">#</span>
          <input id="colorInput" type="text" value="4CAF50" maxlength="7" autocomplete="off" spellcheck="false" aria-describedby="inputError" aria-label="HEXカラーコード">
        </div>
        <p id="inputError" class="error" role="alert"></p>
        <div class="codes" aria-live="polite">
          <div class="code-row"><div><small>HEX</small><strong id="hexValue">#4CAF50</strong></div><button class="copy-button" data-copy="hex" type="button">コピー</button></div>
          <div class="code-row"><div><small>RGB</small><strong id="rgbValue">rgb(76, 175, 80)</strong></div><button class="copy-button" data-copy="rgb" type="button">コピー</button></div>
        </div>
      </div>
    </section>

    <section class="palette-section" aria-labelledby="palette-title">
      <div class="section-heading"><div><p class="eyebrow">120 COLORS</p><h2 id="palette-title">カラーパレット</h2></div><p>クリックして色を選択</p></div>
      <div id="palette" class="palette"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">コピーしました</div>
  <footer>Color Palette · Browser color utility</footer>
  <script src="./app.js" defer></script>
</body>
</html>
