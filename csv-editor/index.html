<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSVテキストを貼り付け、表形式で編集してCSV・TXTとして保存できるツール">
  <title>CSVエディター</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="page-header">
      <div><p class="eyebrow">LOCAL CSV EDITOR</p><h1>CSVエディター</h1><p class="lead">CSVテキストを貼り付けて、使い慣れた表の形で編集できます。</p></div>
      <p class="privacy"><span aria-hidden="true">●</span> データは外部へ送信されず、ブラウザ内だけで処理されます</p>
    </header>

    <section class="import-panel" aria-labelledby="import-title">
      <div class="section-heading"><div><p class="step">STEP 1</p><h2 id="import-title">CSVを貼り付け</h2></div><button id="sampleButton" class="button secondary" type="button">サンプルを入力</button></div>
      <label class="sr-only" for="csvInput">編集するCSVテキスト</label>
      <textarea id="csvInput" rows="7" spellcheck="false" placeholder="名前,部署,メールアドレス&#10;山田 太郎,営業部,taro@example.com"></textarea>
      <div class="import-actions"><p>カンマ、改行、引用符を含む標準的なCSVに対応しています。</p><button id="importButton" class="button primary" type="button">表に反映</button></div>
      <p id="errorMessage" class="error" role="alert" hidden></p>
    </section>

    <section id="editorPanel" class="editor-panel" aria-labelledby="editor-title" hidden>
      <div class="section-heading"><div><p class="step">STEP 2</p><h2 id="editor-title">表を編集</h2><p id="tableSummary" class="summary"></p></div><button id="clearButton" class="button danger" type="button">最初からやり直す</button></div>
      <p class="hint">セルをクリックして編集できます。セル内で改行するには Shift + Enter を押してください。</p>
      <div class="table-wrap"><table id="editorTable" aria-label="CSV編集テーブル"></table></div>
      <div class="add-actions"><button id="addRowButton" class="button secondary" type="button">＋ 行を追加</button><button id="addColumnButton" class="button secondary" type="button">＋ 列を追加</button></div>

      <div class="export-box">
        <div><p class="step">STEP 3</p><h2>ファイルに出力</h2><p>現在の表をUTF-8（BOM付き）で保存します。</p></div>
        <label class="filename">ファイル名 <input id="fileName" type="text" value="edited-data" maxlength="100"></label>
        <div class="download-actions"><button id="downloadCsvButton" class="button primary" type="button">CSVで保存</button><button id="downloadTxtButton" class="button secondary" type="button">TXTで保存</button></div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
