<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JSON の階層とデータ型をブラウザ内で確認できる構造ビューアー">
  <title>JSON Structure Viewer</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">DEVELOPER TOOL</p>
        <h1>JSON Structure Viewer</h1>
        <p class="subtitle">JSON の階層・データ型・要素数を、見通しのよいツリーで確認できます。</p>
      </div>
      <div class="privacy-note" aria-label="プライバシーについて">
        <span class="privacy-dot" aria-hidden="true"></span>
        データはブラウザ内だけで処理されます
      </div>
    </header>

    <section class="workspace" aria-label="JSON 構造ビューアー">
      <section class="panel input-panel">
        <div class="panel-heading">
          <div>
            <span class="step">01</span>
            <h2>JSON Input</h2>
          </div>
          <button id="clearButton" class="text-button" type="button">Clear</button>
        </div>
        <label class="sr-only" for="jsonInput">解析する JSON</label>
        <textarea id="jsonInput" spellcheck="false" autocomplete="off" placeholder='例: {"user":{"id":1,"name":"Taro"}}'></textarea>
        <div class="input-footer">
          <span id="inputStats">0 characters</span>
          <span>JSON は外部へ送信されません</span>
        </div>
      </section>

      <section class="panel viewer-panel">
        <div class="panel-heading viewer-heading">
          <div>
            <span class="step">02</span>
            <h2 id="viewerTitle">Structure</h2>
          </div>
          <div class="viewer-controls">
            <div class="view-switcher" role="group" aria-label="表示形式">
              <button id="treeViewButton" class="is-active" type="button" aria-pressed="true">Tree</button>
              <button id="tableViewButton" type="button" aria-pressed="false">Table</button>
            </div>
            <div id="treeActions" class="tree-actions" aria-label="ツリー操作">
              <button id="expandButton" type="button" disabled>Expand All</button>
              <button id="collapseButton" type="button" disabled>Collapse All</button>
            </div>
          </div>
        </div>

        <div id="emptyState" class="state-message">
          <div class="state-icon" aria-hidden="true">{ }</div>
          <strong>JSON を貼り付けてください</strong>
          <span>圧縮済み・整形済みのどちらにも対応しています</span>
        </div>
        <div id="errorState" class="error-message" role="alert" hidden>
          <strong>Invalid JSON</strong>
          <span id="errorDetail"></span>
        </div>
        <div id="tree" class="tree" role="tree" aria-label="JSON 構造" hidden></div>
        <div id="tableView" class="table-view" hidden>
          <table>
            <thead><tr><th scope="col">Path</th><th scope="col">Key</th><th scope="col">Type</th><th scope="col">Value</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <p id="tableNotice" class="table-notice" hidden></p>
        </div>
      </section>
    </section>

    <footer>
      <span>表示上限: 10 階層</span>
      <span>配列の初期表示: 10 件</span>
      <span>表の表示上限: 1,000 行</span>
    </footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
