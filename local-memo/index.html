<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="データをブラウザ内だけに保存するシンプルなメモ帳">
  <title>Local Memo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><button id="menu-button" class="icon-button menu-button" type="button" aria-label="メモ一覧を開く" aria-expanded="false">☰</button><h1>Local Memo</h1></div>
      <div class="header-actions">
        <button id="history-button" class="secondary" type="button">履歴</button>
        <button id="backup-button" class="secondary" type="button">バックアップ</button>
      </div>
    </header>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    <main class="workspace">
      <aside id="sidebar" class="sidebar" aria-label="メモ一覧">
        <button id="new-note" class="new-note" type="button">＋ 新しいメモ</button>
        <div class="list-heading"><span>メモ一覧</span><span id="note-count">0件</span></div>
        <ul id="note-list" class="note-list"></ul>
      </aside>
      <button id="sidebar-overlay" class="sidebar-overlay" type="button" aria-label="メモ一覧を閉じる"></button>

      <section class="editor" aria-label="メモ編集">
        <div id="empty-state" class="empty-state" hidden><strong>メモがありません</strong><span>「＋ 新しいメモ」から作成してください。</span></div>
        <div id="editor-fields" class="editor-fields">
          <div class="title-row">
            <input id="note-title" class="title-input" type="text" maxlength="120" aria-label="メモタイトル" placeholder="タイトル">
            <button id="delete-note" class="danger-text" type="button">削除</button>
          </div>
          <textarea id="note-content" aria-label="メモ本文" placeholder="ここにメモを書きます…"></textarea>
        </div>
      </section>
    </main>
    <footer class="statusbar"><span id="save-status">保存済み</span><button id="save-button" type="button">今すぐ保存</button></footer>
  </div>

  <dialog id="backup-dialog">
    <div class="dialog-header"><div><h2>バックアップ</h2><p>データは外部へ送信されません。</p></div><button class="dialog-close" type="button" aria-label="閉じる">×</button></div>
    <div class="dialog-actions">
      <button id="export-button" type="button">JSONを書き出す</button>
      <button id="import-button" class="secondary" type="button">JSONから復元</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </dialog>

  <dialog id="history-dialog">
    <div class="dialog-header"><div><h2>バックアップ履歴</h2><p>最新5世代の自動スナップショットです。</p></div><button class="dialog-close" type="button" aria-label="閉じる">×</button></div>
    <div id="history-list" class="history-list"></div>
  </dialog>
</body>
</html>
