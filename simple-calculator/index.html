<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="四則演算の式を入力して、すばやく計算できるシンプルな電卓">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="calculator">
    <header>
      <p class="eyebrow">QUICK CALCULATION</p>
      <h1>Simple Calculator</h1>
      <p class="lead">式を入力するだけの、シンプルな電卓です。</p>
    </header>

    <form id="calculatorForm" class="input-panel" novalidate>
      <label for="expression">計算式</label>
      <div class="input-row">
        <input id="expression" name="expression" type="text" inputmode="text" autocomplete="off"
          placeholder="例：1000 + 250 × 2" aria-describedby="inputHint errorMessage" autofocus>
        <button type="submit">計算</button>
      </div>
      <p id="inputHint" class="hint">入力しながら自動で計算します。+ − × ÷ と括弧が使えます。</p>
      <p id="errorMessage" class="error" role="alert" hidden></p>
    </form>

    <section class="result-panel" aria-labelledby="resultTitle">
      <h2 id="resultTitle">結果</h2>
      <output id="result" aria-live="polite">—</output>
    </section>

    <section class="history-panel" aria-labelledby="historyTitle">
      <div class="section-heading">
        <h2 id="historyTitle">履歴</h2>
        <button id="clearHistory" class="text-button" type="button" hidden>すべて削除</button>
      </div>
      <p id="emptyHistory" class="empty">計算結果はここに表示されます。</p>
      <ol id="historyList" class="history-list" aria-live="polite"></ol>
    </section>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
