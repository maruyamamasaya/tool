<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSV・JSON・YAML・XML・テキストの特徴をブラウザ内で解析するデータインスペクター">
  <title>Data Inspector — データを一瞬で把握</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="#" aria-label="Data Inspector ホーム"><span class="logo" aria-hidden="true">⌘</span><span>Data <strong>Inspector</strong></span></a>
      <p class="local"><span aria-hidden="true">●</span> すべてブラウザ内で処理</p>
    </header>

    <section class="hero">
      <p class="eyebrow">UNDERSTAND YOUR DATA</p>
      <h1>データの中身を、<br><em>一瞬で把握。</em></h1>
      <p class="lead">CSV、JSON、YAML、XML、TEXTに対応。<br>ファイルをドロップするだけで、構造と特徴をすばやく可視化します。</p>
    </section>

    <section class="workspace" aria-label="データ入力">
      <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="ファイルをドロップ、または選択">
        <input id="fileInput" type="file" accept=".csv,.json,.yaml,.yml,.xml,.txt,text/*" hidden>
        <span class="upload-icon" aria-hidden="true">⇧</span>
        <h2>ファイルをドロップ</h2>
        <p>または <button id="selectButton" class="text-button" type="button">ファイルを選択</button></p>
        <small>CSV · JSON · YAML · XML · TEXT</small>
      </div>
      <div class="divider"><span>OR</span></div>
      <div class="paste-area">
        <label for="dataInput">テキストを直接貼り付け</label>
        <textarea id="dataInput" spellcheck="false" placeholder="ここにデータや文章を貼り付けてください..."></textarea>
        <div class="input-footer">
          <span id="liveCount">0 文字</span>
          <button id="inspectButton" class="inspect-button" type="button">解析する <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <p id="errorMessage" class="error" role="alert" hidden></p>

    <section id="results" class="results" aria-live="polite" hidden>
      <div class="result-heading">
        <div><p class="eyebrow">INSPECTION RESULT</p><h2 id="resultTitle">解析結果</h2></div>
        <span id="formatBadge" class="format-badge">TEXT</span>
      </div>
      <div id="statGrid" class="stat-grid"></div>
      <div class="details">
        <h3>文字の内訳</h3>
        <div class="bars">
          <div><span>半角</span><progress id="halfBar" max="100" value="0"></progress><strong id="halfCount">0</strong></div>
          <div><span>全角</span><progress id="fullBar" max="100" value="0"></progress><strong id="fullCount">0</strong></div>
        </div>
      </div>
    </section>

    <footer><span>DATA INSPECTOR</span><span>データは外部へ送信されません</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
