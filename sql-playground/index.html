<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザだけでテーブルを作成・編集し、SQLを試せるSQL Playground">
  <title>SQL Playground</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">SQL</span><div><h1>SQL Playground</h1><p>ブラウザで、すぐに試す。</p></div></div>
    <div class="local"><i></i> ローカルのみで実行</div>
  </header>
  <main>
    <section class="workspace" aria-label="SQL実行ワークスペース">
      <article class="panel query-panel">
        <div class="panel-head"><div><span class="step">01</span><h2>SQLクエリ</h2></div><button id="sampleButton" class="text-button" type="button">サンプルに戻す</button></div>
        <div class="editor"><div class="editor-label"><span><i></i><i></i><i></i></span>query.sql <kbd>Ctrl</kbd> + <kbd>Enter</kbd></div><textarea id="sqlInput" spellcheck="false" aria-label="実行するSQL">SELECT id, name, role, active
FROM users
WHERE active = true
ORDER BY id;</textarea></div>
        <div class="query-actions"><span>CREATE / INSERT / SELECT / DELETE を複数まとめて実行できます</span><button id="runButton" class="primary" type="button"><span aria-hidden="true">▶</span> SQLを実行</button></div>
        <div id="message" class="message" role="alert" hidden></div>
      </article>
      <article class="panel result-panel">
        <div class="panel-head"><div><span class="step">02</span><h2>実行結果</h2></div><span id="resultMeta" class="count">0 rows</span></div>
        <div id="resultEmpty" class="empty"><div>▷</div><b>SQLを実行してください</b><p>実行結果がここに表示されます。</p></div>
        <div id="resultTable" class="table-scroll" hidden></div>
      </article>
    </section>

    <section class="data-section" aria-labelledby="dataTitle">
      <div class="data-heading"><div><p class="eyebrow">DATA SET</p><h2 id="dataTitle">テストデータ</h2><p>セルをクリックして、直接編集できます。</p></div><div class="data-actions"><button id="toggleData" class="secondary" type="button" aria-expanded="true">▴ データを非表示</button><button id="addTable" class="primary light" type="button">＋ テーブルを追加</button></div></div>
      <div id="dataBody"><div id="tabs" class="tabs" role="tablist"></div><article class="panel table-editor"><div class="table-toolbar"><div><span id="tableName"></span><span id="tableMeta"></span></div><div><button id="addColumn" class="text-button" type="button">＋ 列を追加</button><button id="addRow" class="secondary" type="button">＋ 行を追加</button><button id="deleteTable" class="danger" type="button">テーブルを削除</button></div></div><div id="dataTable" class="table-scroll"></div><p class="save-note"><span>✓</span> 変更はブラウザに自動保存されます</p></article></div>
    </section>
  </main>
  <footer>SQL Playground <span>データは外部に送信されません</span></footer>
</body>
</html>
