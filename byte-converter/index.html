<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="バイト・KB・MB・GBをすぐに換算できるシンプルな単位変換ツール">
  <meta name="theme-color" content="#f7f7f5">
  <title>Byte Converter</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="converter">
    <header>
      <div class="mark" aria-hidden="true">B</div>
      <div>
        <h1>Byte Converter</h1>
        <p>データ容量をかんたん換算</p>
      </div>
    </header>

    <section class="input-card" aria-labelledby="input-title">
      <div class="input-heading">
        <label id="input-title" for="valueInput">変換する値</label>
        <fieldset class="mode-switch" aria-label="入力方法">
          <label><input type="radio" name="inputMode" value="auto" checked><span>自動読み取り</span></label>
          <label><input type="radio" name="inputMode" value="manual"><span>プルダウン</span></label>
        </fieldset>
      </div>
      <div class="input-row">
        <input id="valueInput" type="text" value="1 MB" inputmode="text" autocomplete="off" placeholder="例: 1234567kB" aria-describedby="inputHint errorMessage">
        <select id="unitInput" aria-label="変換元の単位">
          <option value="B">B</option>
          <option value="KB">KB</option>
          <option value="MB" selected>MB</option>
          <option value="GB">GB</option>
          <option value="TB">TB</option>
          <option value="KiB">KiB</option>
          <option value="MiB">MiB</option>
          <option value="GiB">GiB</option>
          <option value="TiB">TiB</option>
        </select>
      </div>
      <p id="inputHint" class="input-hint">数値と単位を含むテキストを、そのまま貼り付けられます。</p>
      <p id="errorMessage" class="error" role="alert"></p>
    </section>

    <section class="results" aria-labelledby="result-title">
      <div class="section-title">
        <h2 id="result-title">変換結果</h2>
        <span id="standardLabel">1 MB = 1,000,000 bytes</span>
      </div>
      <div id="resultGrid" class="result-grid" aria-live="polite"></div>
    </section>

    <p class="note"><strong>KB / MB / GB</strong> は 1,000 倍、<strong>KiB / MiB / GiB</strong> は 1,024 倍で計算します。</p>
  </main>
  <script src="./script.js" defer></script>
</body>
</html>
