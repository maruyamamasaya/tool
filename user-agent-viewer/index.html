<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザ・OS・端末情報をその場で確認、コピーできるUser-Agent Viewer">
  <meta name="theme-color" content="#f5f7fb">
  <title>User-Agent Viewer — ブラウザ情報をすぐ確認</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="site-header">
      <a class="brand" href="./" aria-label="User-Agent Viewer ホーム">
        <span class="brand-mark" aria-hidden="true">UA</span>
        <span>User-Agent <strong>Viewer</strong></span>
      </a>
      <span class="privacy"><span aria-hidden="true">●</span> 端末内でのみ処理</span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">YOUR DEVICE AT A GLANCE</p>
      <h1 id="page-title">この端末の情報</h1>
      <p>ブラウザから取得できる情報を自動で表示しています。<br>問い合わせや動作確認に、そのままコピーして使えます。</p>
    </section>

    <section class="summary-card" aria-label="端末情報の概要">
      <div class="device-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 14.5v-9ZM2.5 19h19"/></svg>
      </div>
      <div class="summary-copy">
        <span id="deviceType" class="device-badge">確認中</span>
        <h2 id="browserSummary">ブラウザ情報を取得しています</h2>
        <p id="osSummary">—</p>
      </div>
      <span id="onlineStatus" class="status-badge"><i></i>確認中</span>
    </section>

    <section class="info-section" aria-labelledby="detail-title">
      <div class="section-heading">
        <div><p class="eyebrow">DETAILS</p><h2 id="detail-title">詳細情報</h2></div>
        <button id="refreshButton" class="refresh-button" type="button" aria-label="情報を更新"><span aria-hidden="true">↻</span> 更新</button>
      </div>
      <dl id="infoGrid" class="info-grid" aria-live="polite"></dl>
    </section>

    <section class="ua-card" aria-labelledby="ua-title">
      <div class="ua-heading">
        <div><p class="eyebrow">RAW DATA</p><h2 id="ua-title">User-Agent</h2></div>
        <button id="copyUaButton" class="secondary-button" type="button"><span aria-hidden="true">□</span> User-Agentをコピー</button>
      </div>
      <code id="userAgent">取得しています...</code>
    </section>

    <button id="copyAllButton" class="primary-button" type="button"><span aria-hidden="true">▣</span> すべてコピー</button>
    <p id="copyStatus" class="copy-status" role="status" aria-live="polite"></p>

    <footer><span>USER-AGENT VIEWER</span><span>情報は外部へ送信されません</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
