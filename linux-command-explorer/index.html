<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="162のLinuxコマンドを検索できる、ブラウザ完結型コマンドリファレンス">
  <title>Linux Command Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Linux Command Explorer ホーム"><span class="logo">&gt;_</span><span><b>Linux Command</b><small>Explorer</small></span></a>
    <div class="top-actions"><span id="commandCount" class="count"></span><button id="themeToggle" class="icon-button" type="button" aria-label="テーマを切り替える">☾</button></div>
  </header>
  <main class="app-shell">
    <aside class="sidebar" aria-label="コマンドの絞り込み">
      <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="コマンドを検索..." autocomplete="off"><kbd>/</kbd></label>
      <div class="side-heading"><span>カテゴリ</span><button id="clearFilter" type="button">すべて表示</button></div>
      <nav id="categoryList" class="categories" aria-label="カテゴリ一覧"></nav>
      <section class="side-section"><div class="side-heading"><span>★ お気に入り</span></div><div id="favoriteList" class="mini-list"></div></section>
      <section class="side-section"><div class="side-heading"><span>◷ 最近見たコマンド</span><button id="clearHistory" type="button">消去</button></div><div id="historyList" class="mini-list"></div></section>
    </aside>
    <section class="workspace">
      <div class="results-head"><div><p class="eyebrow">COMMAND LIBRARY</p><h1 id="resultTitle">すべてのコマンド</h1></div><span id="resultCount"></span></div>
      <div class="content-grid">
        <div id="commandList" class="command-list" aria-label="コマンド一覧"></div>
        <article id="detail" class="detail" aria-live="polite"></article>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite">✓ コピーしました</div>
</body>
</html>
