<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browser Toolsに表示するツールを選択します">
    <title>ツール表示設定 | Browser Tools</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <a class="back-link" href="../">← ツール一覧へ戻る</a>
        <p class="eyebrow">Browser Tools</p>
        <h1>ツール表示設定</h1>
        <p class="lead">一覧ページに表示するツールを選べます。設定はこのブラウザに自動保存されます。</p>
      </div>
    </header>

    <main>
      <section class="preset-panel" aria-labelledby="preset-title">
        <h2 id="preset-title">プリセット</h2>
        <p>「よく使うツール」は、日常的なテキスト・データ作業向けのおすすめ構成です。</p>
        <div class="preset-actions">
          <button type="button" data-preset="frequent">★ よく使うツール</button>
          <button type="button" data-preset="all">すべて表示</button>
          <button type="button" data-preset="none">すべて非表示</button>
        </div>
      </section>

      <div class="settings-heading">
        <div>
          <h2>ツールを選ぶ</h2>
          <p id="selection-status" aria-live="polite">ツールを読み込んでいます。</p>
        </div>
        <label class="search-field">
          <span>ツールを検索</span>
          <input id="tool-search" type="search" placeholder="名前や説明で絞り込み">
        </label>
      </div>

      <div id="tool-settings" class="tool-settings"></div>
      <p id="load-error" class="load-error" role="alert" hidden>ツール一覧を読み込めませんでした。一覧ページから開き直してください。</p>
    </main>
  </body>
</html>
